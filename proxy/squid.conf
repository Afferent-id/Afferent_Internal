# TLS inspection enabled: Squid acts as MITM, bumps HTTPS connections,
# generates per-site certificates signed by the AFFERENT Proxy CA.
# Clients MUST have the CA cert installed in their browser/OS trust store.
http_port 3128 ssl-bump \
    cert=/etc/squid/ssl_cert/afferent-proxy-ca.crt \
    key=/etc/squid/ssl_cert/afferent-proxy-ca.key \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=4MB

# Dynamic certificate generator (squid-openssl package)
sslcrtd_program /usr/lib/squid/security_file_certgen \
    -s /var/lib/squid/ssl_db -M 4MB
sslcrtd_children 8

visible_hostname afferent-proxy

# SSL bump steps:
# Step 1 (peek): read SNI from ClientHello without decrypting — gets hostname
# Step 2+ (bump): MITM the connection so Squid can inspect & block per-request
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 21
acl Safe_ports port 1025-65535
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager

# Reserved browser-side connectivity probe. The .invalid TLD can never resolve
# directly, so receiving this local response proves the browser is using Squid.
acl afferent_probe dstdomain proxy-check.afferent.invalid
deny_info ERR_AFFERENT_PROBE afferent_probe
http_access deny afferent_probe

# Do not cache ACL answers in Squid: SOC policy updates must affect the next
# request immediately. With ssl-bump, %URI now contains the full HTTPS URL.
external_acl_type afferent_decision ttl=0 negative_ttl=0 children-max=30 children-startup=5 \
    %SRC %>rm %URI /usr/local/bin/afferent_acl_helper.py
acl afferent_block external afferent_decision
deny_info ERR_AFFERENT_BLOCK afferent_block
http_access deny afferent_block
http_access allow all

cache deny all
access_log stdio:/var/log/squid/access.log
cache_log stdio:/var/log/squid/cache.log
forwarded_for delete
request_header_access X-Forwarded-For deny all
error_directory /usr/share/squid/errors/en
