# Allowed HTTPS is spliced unchanged. Only denied connections are terminated
# with the trusted lab CA to serve a local blocking page, never an origin page.
http_port 127.0.0.1:3129 require-proxy-header ssl-bump \
    cert=/etc/squid/ssl_cert/afferent-proxy-ca.crt \
    key=/etc/squid/ssl_cert/afferent-proxy-ca.key \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=4MB
http_port 127.0.0.1:3130
proxy_protocol_access allow localhost
proxy_protocol_access deny all

# Dynamic certificate generator (squid-openssl package)
sslcrtd_program /usr/lib/squid/security_file_certgen \
    -s /var/lib/squid/ssl_db -M 4MB
sslcrtd_children 8

visible_hostname afferent-proxy
shutdown_lifetime 2 seconds

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 21
acl Safe_ports port 1025-65535
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager

# Reserved browser-side connectivity probe. The .invalid TLD can never resolve
# directly, so receiving this local response proves the browser is using Squid.
acl afferent_probe dstdomain proxy-check.afferent.invalid
deny_info ERR_AFFERENT_PROBE afferent_probe
http_access deny afferent_probe

# Preserve the real employee address forwarded by the loopback TCP relay.
external_acl_type afferent_decision ttl=0 negative_ttl=0 children-max=30 children-startup=5 \
    %>a %>p %>la %>lp %>rm %URI /usr/local/bin/afferent_acl_helper.py
acl afferent_block external afferent_decision
acl mark_denied annotate_client afferent_denied=true
acl was_denied note afferent_denied true

# Do not deny CONNECT with a plain 403: browsers cannot render its HTML.
# Decide on the CONNECT domain before opening an origin HTTP request. Bump
# denied sessions locally; splice everything else unchanged, including TLS.
ssl_bump bump afferent_block mark_denied
ssl_bump splice all

deny_info ERR_AFFERENT_BLOCK afferent_block
deny_info ERR_AFFERENT_BLOCK was_denied
http_access allow CONNECT
# A connection bumped for denial must never forward a later request even if
# SOC flips the policy to Allow while its TLS handshake is in progress.
http_access deny was_denied
http_access deny afferent_block
http_access allow all

cache deny all
access_log stdio:/var/log/squid/access.log
cache_log stdio:/var/log/squid/cache.log
forwarded_for delete
request_header_access X-Forwarded-For deny all
error_directory /usr/share/squid/errors/en
