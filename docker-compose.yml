services:
  # 1. ORCHESTRATOR LAYER
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: hfl-n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=Asia/Jakarta
      - NODE_OPTIONS=--dns-result-order=ipv4first
      # Wajib false, karena n8n versi baru default BLOKIR akses process.env
      # dari dalam expression node ({{ $env.X }}) demi keamanan. Flow B
      # butuh ini supaya VT_API_KEY & URLSCAN_API_KEY bisa dibaca dari
      # environment variable, bukan hardcoded di JSON workflow.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_ALLOW_ENV_VARIABLES=*
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - VT_API_KEY=${VT_API_KEY}
      - URLSCAN_API_KEY=${URLSCAN_API_KEY}
      - SOC_CHAT_ID=${SOC_CHAT_ID}
      - SECRET_KEY=${SECRET_KEY}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - N8N_PROXY_HOPS=1
    volumes:
      - n8n_data:/home/node/.n8n
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    depends_on:
      - flask_api
    networks:
      - hfl_network

  # 2. SIMULATION LAYER
  # Catatan: admin panel GoPhish default pakai HTTPS (self-signed cert) di
  # port 3333. Akses via https://localhost:3333 (browser akan warning
  # certificate tidak trusted, itu normal untuk self-signed, klik "lanjutkan").
  gophish:
    build: ./gophish
    container_name: hfl-gophish
    ports:
      - "3333:3333"   # Admin Panel (HTTPS)
      - "8080:80"      # Phishing Server (Landing Pages) - dipindah ke 8080
                        # supaya tidak konflik dengan service lain yang
                        # mungkin sudah pakai port 80 di laptop
    volumes:
      - ./gophish/config.json:/opt/gophish/config.json
      - gophish_data:/opt/gophish/database
      # config.json di-override supaya db_path mengarah ke subfolder
      # "database/" yang kita mount sebagai volume bernama gophish_data.
      # GoPhish TIDAK punya environment variable untuk override db_path
      # (sudah dicek di dokumentasi resmi & beberapa proyek docker-compose
      # komunitas) — env var yang didukung resmi hanya untuk admin/phish
      # server listen_url, TLS, dan contact_address. Override config.json
      # adalah satu-satunya cara yang terkonfirmasi benar untuk ini.
    restart: unless-stopped
    networks:
      - hfl_network

  # 3. ANALYTICS & API LAYER (Backend — Threat Intelligence + SOC Dashboard)
  flask_api:
    build: ./backend
    container_name: hfl-flask
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app           # Live-reload pas development
      - flask_db:/app/instance   # Persistence SQLite Flask
    env_file:
      - .env
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_DEBUG=0

      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - DEV_BYPASS_AUTH=${DEV_BYPASS_AUTH}
      - BOT_USERNAME=${BOT_USERNAME}

      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}

      - GOPHISH_API_KEY=${GOPHISH_API_KEY}
      - GOPHISH_API_URL=${GOPHISH_API_URL}

      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

      - VT_API_KEY=${VT_API_KEY}
      - URLSCAN_API_KEY=${URLSCAN_API_KEY}
      - SOC_CHAT_ID=${SOC_CHAT_ID}
      - WEBHOOK_URL=${WEBHOOK_URL}
    restart: unless-stopped
    networks:
      - hfl_network

  # 4. PRESENTATION LAYER (User-Faced Dashboard — Next.js)
  # Arsitektur: Dashboard TIDAK berisi business logic. Hanya menerima
  # data dari Threat Intelligence Service (flask_api / n8n) via webhook
  # POST ke /api/incident, /api/cache, /api/summary, lalu menampilkannya.
  # Login: Bot-First Magic Link (tanpa username/password tradisional).
  dashboard:
    build: ./dashboard
    container_name: hfl-dashboard
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://flask_api:5000
      - NEXT_PUBLIC_BOT_USERNAME=${BOT_USERNAME}
      - API_URL=http://flask_api:5000
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - DEV_BYPASS_AUTH=${DEV_BYPASS_AUTH}
    depends_on:
      - flask_api
    restart: unless-stopped
    networks:
      - hfl_network

volumes:
  n8n_data:
  gophish_data:
  flask_db:

networks:
  hfl_network:
    driver: bridge
