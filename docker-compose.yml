services:
  # PostgreSQL is the durable source of truth for proxy telemetry, verdicts,
  # SOC alerts, and append-only decision audit records. It is not published.
  proxy_postgres:
    image: postgres:17-alpine
    container_name: hfl-proxy-postgres
    env_file:
      - .env.proxy.local
    volumes:
      - proxy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - hfl_network

  # Redis is the low-latency hot path. PostgreSQL remains authoritative.
  proxy_redis:
    image: redis:7-alpine
    container_name: hfl-proxy-redis
    env_file:
      - .env.proxy.local
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - proxy_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - hfl_network

  # Local SMTP inbox for lab/demo. SMTP stays inside the Docker network;
  # only the web inbox is exposed to the host.
  mailpit:
    image: axllent/mailpit@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    container_name: hfl-mailpit
    ports:
      - "${MAILPIT_BIND_IP:-127.0.0.1}:8025:8025"
    environment:
      - MP_MAX_MESSAGES=500
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - hfl_network

  # 2. SIMULATION LAYER
  # Catatan: admin panel GoPhish default pakai HTTPS (self-signed cert) di
  # port 3333. Akses via https://localhost:3333 (browser akan warning
  # certificate tidak trusted, itu normal untuk self-signed, klik "lanjutkan").
  gophish:
    build: ./gophish
    container_name: hfl-gophish
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/3333"]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "${GOPHISH_ADMIN_BIND_IP:-127.0.0.1}:3333:3333"
      - "${WEB_BIND_IP:-127.0.0.1}:8080:80"
                        # supaya tidak konflik dengan service lain yang
                        # mungkin sudah pakai port 80 di laptop
    volumes:
      - ./gophish/config.json:/opt/gophish/config.json
      - type: bind
        source: ${GOPHISH_CERT_DIR:-./secrets/gophish-pki}/gophish-admin.crt
        target: /opt/gophish/gophish_admin.crt
        read_only: true
      - type: bind
        source: ${GOPHISH_CERT_DIR:-./secrets/gophish-pki}/gophish-admin.key
        target: /opt/gophish/gophish_admin.key
        read_only: true
      - gophish_data:/opt/gophish/database
      # config.json di-override supaya db_path mengarah ke subfolder
      # "database/" yang kita mount sebagai volume bernama gophish_data.
      # GoPhish TIDAK punya environment variable untuk override db_path
      # (sudah dicek di dokumentasi resmi & beberapa proyek docker-compose
      # komunitas) — env var yang didukung resmi hanya untuk admin/phish
      # server listen_url, TLS, dan contact_address. Override config.json
      # adalah satu-satunya cara yang terkonfirmasi benar untuk ini.
    restart: unless-stopped
    networks:
      - hfl_network

  # 3. ANALYTICS & API LAYER (Backend — Threat Intelligence + SOC Dashboard)
  flask_api:
    build: ./backend
    container_name: hfl-flask
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:5000:5000"
    volumes:
      - ./backend:/app           # Source mount; restart gunicorn after edits.
      - flask_db:/app/instance   # Persistence SQLite Flask
      - type: bind
        source: ${GOPHISH_CERT_DIR:-./secrets/gophish-pki}/afferent-lab-ca.crt
        target: /etc/afferent-ca/gophish-ca.crt
        read_only: true
      - type: bind
        source: ./proxy/ssl/afferent-proxy-ca.crt
        target: /etc/afferent-proxy/afferent-proxy-ca.crt
        read_only: true
    env_file:
      - .env.proxy.local
    environment:
      - APP_ENV=${APP_ENV:-production}
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - DB_PATH=/app/instance/human_firewall.db

      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - DEV_BYPASS_AUTH=${DEV_BYPASS_AUTH}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@humanfirewall.local}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-true}
      - OTP_PEPPER=${OTP_PEPPER:-}
      - AUTH_AUDIT_PEPPER=${AUTH_AUDIT_PEPPER:-}
      - OTP_EXPIRY_SECONDS=${OTP_EXPIRY_SECONDS:-300}
      - OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS:-5}
      - OTP_RESEND_COOLDOWN_SECONDS=${OTP_RESEND_COOLDOWN_SECONDS:-60}
      - OTP_RATE_LIMIT_WINDOW_SECONDS=${OTP_RATE_LIMIT_WINDOW_SECONDS:-900}
      - OTP_MAX_REQUESTS_PER_WINDOW=${OTP_MAX_REQUESTS_PER_WINDOW:-5}
      - AUTH_SESSION_TTL_SECONDS=${AUTH_SESSION_TTL_SECONDS:-28800}
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH:-12}

      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-AFFERENT Security <security@afferent.local>}
      - SMTP_SECURITY=none
      - SMTP_TIMEOUT_SECONDS=${SMTP_TIMEOUT_SECONDS:-10}
      - EDUCATION_EMAIL_ENABLED=${EDUCATION_EMAIL_ENABLED:-true}
      - EDUCATION_AUTO_ENABLED=${EDUCATION_AUTO_ENABLED:-false}
      - EDUCATION_SCORE_THRESHOLD=${EDUCATION_SCORE_THRESHOLD:-60}
      - EDUCATION_COOLDOWN_SECONDS=${EDUCATION_COOLDOWN_SECONDS:-86400}

      - PROXY_FEATURE_ENABLED=true
      - PROXY_DB_HOST=proxy_postgres
      - PROXY_DB_PORT=5432
      - PROXY_DB_NAME=${PROXY_DB_NAME:-afferent_proxy}
      - PROXY_DB_USER=${PROXY_DB_USER:-afferent_proxy_app}
      - REDIS_HOST=proxy_redis
      - REDIS_PORT=6379
      - ML_SCANNER_URL=${ML_SCANNER_URL:-}
      - ML_LOCAL_ENABLED=${ML_LOCAL_ENABLED:-true}
      - ML_DOMAIN_MODEL_DIR=${ML_DOMAIN_MODEL_DIR:-/app/models/domain_v3}
      - ML_CPU_THREADS=${ML_CPU_THREADS:-2}
      - ML_URL_CACHE_TTL_SECONDS=${ML_URL_CACHE_TTL_SECONDS:-3600}
      - ML_TLS_CA_BUNDLE=${ML_TLS_CA_BUNDLE:-}
      - ML_SCANNER_TIMEOUT_SECONDS=${ML_SCANNER_TIMEOUT_SECONDS:-1.5}
      - ML_BLOCK_CONFIDENCE_THRESHOLD=${ML_BLOCK_CONFIDENCE_THRESHOLD:-0.85}
      - ML_ALLOW_CONFIDENCE_THRESHOLD=${ML_ALLOW_CONFIDENCE_THRESHOLD:-0.80}
      - PROXY_DEVICE_TTL_SECONDS=${PROXY_DEVICE_TTL_SECONDS:-28800}
      - PROXY_CONNECTED_WINDOW_SECONDS=${PROXY_CONNECTED_WINDOW_SECONDS:-90}
      - PROXY_ML_VERDICT_TTL_SECONDS=${PROXY_ML_VERDICT_TTL_SECONDS:-604800}
      - PROXY_ML_CACHE_TTL_SECONDS=${PROXY_ML_CACHE_TTL_SECONDS:-3600}
      - PROXY_SOC_CACHE_TTL_SECONDS=${PROXY_SOC_CACHE_TTL_SECONDS:-86400}
      - PROXY_UNKNOWN_RETRY_SECONDS=${PROXY_UNKNOWN_RETRY_SECONDS:-60}
      - PROXY_IDEMPOTENCY_TTL_SECONDS=${PROXY_IDEMPOTENCY_TTL_SECONDS:-600}
      - PROXY_BOOTSTRAP_ALLOW_DOMAINS=${PROXY_BOOTSTRAP_ALLOW_DOMAINS:-}
      - PUBLIC_PROXY_URL=${PUBLIC_PROXY_URL:-http://127.0.0.1:3128}

      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-}
      - AI_HEATMAP_USE_LLM=${AI_HEATMAP_USE_LLM:-false}
      - VT_API_KEY=${VT_API_KEY:-}
      - URLSCAN_API_KEY=${URLSCAN_API_KEY:-}
      - FILE_SCAN_MAX_MB=${FILE_SCAN_MAX_MB:-${PDF_REPORT_MAX_MB:-10}}
      - FILE_SCAN_RETENTION_SECONDS=${FILE_SCAN_RETENTION_SECONDS:-${PDF_REPORT_RETENTION_SECONDS:-3600}}
      - VT_REQUESTS_PER_MINUTE=${VT_REQUESTS_PER_MINUTE:-4}
      - LOCAL_LLM_ENABLED=${LOCAL_LLM_ENABLED:-false}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      - LOCAL_LLM_OUTPUT_MODE=${LOCAL_LLM_OUTPUT_MODE:-json}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://local_llm:11434}
      - LOCAL_LLM_TIMEOUT_SECONDS=${LOCAL_LLM_TIMEOUT_SECONDS:-45}

      - GOPHISH_API_KEY=${GOPHISH_API_KEY}
      - GOPHISH_API_URL=${GOPHISH_API_URL}
      - GOPHISH_CA_BUNDLE=${GOPHISH_CA_BUNDLE:-}
      - GOPHISH_PHISH_PUBLIC_URL=${GOPHISH_PHISH_PUBLIC_URL:-}
      - GOPHISH_ADMIN_PUBLIC_URL=${GOPHISH_ADMIN_PUBLIC_URL:-https://localhost:3333}
      - MAILPIT_PUBLIC_URL=${MAILPIT_PUBLIC_URL:-http://127.0.0.1:8025}

      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

      - SERVER_BASE_URL=${SERVER_BASE_URL:-}
      - SIMULATION_BASE_URL=${SIMULATION_BASE_URL:-}
      - SIMULATION_EDUCATION_URL=${SIMULATION_EDUCATION_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_started
      proxy_postgres:
        condition: service_healthy
      proxy_redis:
        condition: service_healthy
    networks:
      - hfl_network

  # 4. PRESENTATION LAYER (User-Faced Dashboard — Next.js)
  # Same-origin BFF forwards session identity to Flask; SOC uses SSE.
  # Login: email + password + OTP, dengan session cookie via Next.js BFF.
  dashboard:
    build: ./dashboard
    container_name: hfl-dashboard
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/config').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:3000:3000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://127.0.0.1:3000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://127.0.0.1:5000}
      - API_URL=http://flask_api:5000
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - DEV_BYPASS_AUTH=${DEV_BYPASS_AUTH}
      - NEXT_PUBLIC_PROXY_URL=${PUBLIC_PROXY_URL:-http://127.0.0.1:3128}
      - NEXT_PUBLIC_PROXY_PROBE_URL=${PUBLIC_PROXY_PROBE_URL:-http://proxy-check.afferent.invalid/__afferent_probe__}
      - FILE_SCAN_MAX_MB=${FILE_SCAN_MAX_MB:-${PDF_REPORT_MAX_MB:-10}}
    depends_on:
      flask_api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hfl_network

  # Explicit forward proxy for employee devices. Bind to a Tailscale/LAN IP
  # via PROXY_BIND_IP; loopback is the safe default for local development.
  # Allowed TLS is spliced. Only denied connections use the lab CA for a
  # branded HTTPS block page. A TCP relay owns/revokes individual tunnels;
  # no privileged container, NET_ADMIN, or Docker socket is needed.
  centralized_proxy:
    build: ./proxy
    container_name: hfl-centralized-proxy
    ports:
      - "${PROXY_BIND_IP:-127.0.0.1}:${PROXY_PORT:-3128}:3128"
    environment:
      - PROXY_PORTAL_URL=${PROXY_PORTAL_URL:-}
      - SERVER_BASE_URL=${SERVER_BASE_URL:-}
      - PROXY_DECISION_API_URL=http://flask_api:5000/api/proxy/decision
      - PROXY_DECISION_TIMEOUT_SECONDS=${PROXY_DECISION_TIMEOUT_SECONDS:-2.5}
      - PROXY_FAIL_MODE=${PROXY_FAIL_MODE:-closed}
      - PROXY_ENFORCEMENT_API_URL=http://flask_api:5000/api/proxy/enforcement/check
      - PROXY_REVOCATION_INTERVAL_SECONDS=${PROXY_REVOCATION_INTERVAL_SECONDS:-0.5}
      - PROXY_MAX_CONNECTIONS=${PROXY_MAX_CONNECTIONS:-1000}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
    volumes:
      # CA is used only for denial pages, never to inspect allowed HTTPS.
      - ./proxy/ssl:/etc/squid/ssl_cert:ro
    depends_on:
      flask_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client,time; from pathlib import Path; c=http.client.HTTPConnection('127.0.0.1',3130,timeout=2); c.request('GET','/squid-internal-mgr/info',headers={'Host':'127.0.0.1:3130'}); assert c.getresponse().status==200; assert time.time()-Path('/run/afferent/controller-heartbeat').stat().st_mtime < 15"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    networks:
      - hfl_network

  # Mailpit-only education/warnings; no SMTP provider or n8n is required.
  notification_worker:
    build: ./backend
    container_name: hfl-notification-worker
    command: ["python", "notification_worker.py"]
    volumes:
      - flask_db:/app/instance
      - type: bind
        source: ${GOPHISH_CERT_DIR:-./secrets/gophish-pki}/afferent-lab-ca.crt
        target: /etc/afferent-ca/gophish-ca.crt
        read_only: true
    environment:
      - DB_PATH=/app/instance/human_firewall.db
      - GOPHISH_SYNC_ENABLED=${GOPHISH_SYNC_ENABLED:-true}
      - GOPHISH_API_KEY=${GOPHISH_API_KEY}
      - GOPHISH_API_URL=${GOPHISH_API_URL}
      - GOPHISH_CA_BUNDLE=${GOPHISH_CA_BUNDLE:-}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_SECURITY=none
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-AFFERENT Security <security@afferent.local>}
      - SMTP_TIMEOUT_SECONDS=10
      - EDUCATION_EMAIL_ENABLED=${EDUCATION_EMAIL_ENABLED:-true}
      - EDUCATION_SCORE_THRESHOLD=${EDUCATION_SCORE_THRESHOLD:-60}
      - EDUCATION_AUTO_ENABLED=${EDUCATION_AUTO_ENABLED:-false}
      - EDUCATION_COOLDOWN_SECONDS=${EDUCATION_COOLDOWN_SECONDS:-86400}
    depends_on:
      flask_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time()-Path('/tmp/afferent-mail-heartbeat').stat().st_mtime < 120"]
      interval: 15s
      timeout: 3s
      retries: 8
    restart: unless-stopped
    networks:
      - hfl_network

  # Optional offline hostname second opinion. No public API port is published.
  local_llm:
    image: ollama/ollama:0.35.1
    profiles: [llm]
    environment:
      - OLLAMA_NO_CLOUD=true
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_CONTEXT_LENGTH=2048
    gpus: all
    volumes:
      - local_llm_models:/root/.ollama
      - ./ml/artifacts:/models:ro
      - ./ml/local_llm/Modelfile:/training/Modelfile:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [hfl_network]

  review_worker:
    build: ./backend
    command: ["python", "review_worker.py"]
    env_file: [.env.proxy.local]
    volumes:
      - flask_db:/app/instance
    environment:
      - DB_PATH=/app/instance/human_firewall.db
      - PROXY_DB_HOST=proxy_postgres
      - PROXY_DB_PORT=5432
      - PROXY_DB_NAME=${PROXY_DB_NAME:-afferent_proxy}
      - PROXY_DB_USER=${PROXY_DB_USER:-afferent_proxy_app}
      - REDIS_HOST=proxy_redis
      - REDIS_PORT=6379
      - VT_API_KEY=${VT_API_KEY:-}
      - VT_REQUESTS_PER_MINUTE=${VT_REQUESTS_PER_MINUTE:-4}
      - LOCAL_LLM_ENABLED=${LOCAL_LLM_ENABLED:-false}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://local_llm:11434}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      - LOCAL_LLM_TIMEOUT_SECONDS=${LOCAL_LLM_TIMEOUT_SECONDS:-45}
      - LOCAL_LLM_OUTPUT_MODE=${LOCAL_LLM_OUTPUT_MODE:-json}
    depends_on:
      flask_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time()-Path('/tmp/afferent-review-heartbeat').stat().st_mtime < 120"]
      interval: 15s
      timeout: 3s
      retries: 8
    restart: unless-stopped
    networks: [hfl_network]

volumes:
  local_llm_models:
  mailpit_data:
  gophish_data:
  flask_db:
  proxy_postgres_data:
  proxy_redis_data:

networks:
  hfl_network:
    driver: bridge
